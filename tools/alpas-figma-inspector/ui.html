<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font: 12px/1.5 system-ui, sans-serif; color: var(--figma-color-text, #202124); background: var(--figma-color-bg, #fff); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 16px; border-bottom: 1px solid var(--figma-color-border, #d1d5db); }
    h1 { margin: 0 0 4px; font-size: 16px; }
    p { margin: 4px 0; }
    .muted { color: var(--figma-color-text-secondary, #666); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    label { display: inline-flex; align-items: center; gap: 4px; }
    button, select, textarea { font: inherit; }
    button { min-height: 30px; padding: 4px 10px; border: 1px solid var(--figma-color-border, #d1d5db); border-radius: 4px; color: inherit; background: var(--figma-color-bg-secondary, #f5f6f8); cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #2468eb; outline-offset: 2px; }
    main { padding: 12px 16px 24px; }
    #status { min-height: 22px; overflow-wrap: anywhere; }
    .warning { color: var(--figma-color-text-warning, #9b5200); white-space: pre-line; }
    .node { border: 1px solid var(--figma-color-border, #d1d5db); border-radius: 6px; margin: 8px 0; padding: 8px; }
    summary { cursor: pointer; overflow-wrap: anywhere; font-weight: 600; }
    .path { overflow-wrap: anywhere; font-size: 11px; margin: 5px 0; }
    dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 5px 8px; margin: 8px 0; }
    dt { color: var(--figma-color-text-secondary, #666); }
    dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .text { border-left: 2px solid var(--figma-color-border, #d1d5db); padding-left: 8px; margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
    textarea { display: block; width: 100%; height: 170px; resize: vertical; border: 1px solid var(--figma-color-border, #d1d5db); border-radius: 4px; padding: 8px; color: inherit; background: var(--figma-color-bg, #fff); font: 11px/1.5 ui-monospace, monospace; }
    #export { margin: 12px 0; }
  </style>
</head>
<body>
  <header>
    <h1>ALPAS 수치 확인</h1>
    <p class="muted">v1.0.1 · 읽기 전용</p>
    <p class="muted">컴포넌트를 클릭하면 내부 텍스트까지 표시합니다. 디자인 수정·네트워크 전송 없음.</p>
    <div class="controls">
      <label><input id="children" type="checkbox" checked> 하위 레이어 포함</label>
      <label><input id="hidden" type="checkbox"> 숨김 레이어 포함</label>
      <button id="refresh" type="button">다시 읽기</button>
    </div>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite">Figma 연결 준비 중… 이 문구가 계속 보이면 플러그인을 닫고 다시 실행하세요.</p>
    <p id="warnings" class="warning"></p>
    <div id="export" class="controls">
      <label>내보내기 <select id="format"><option value="json">JSON · 전체 수치</option><option value="summary">요약 · 대화 붙여넣기</option></select></label>
      <button id="copy" type="button" disabled>복사</button>
      <button id="save" type="button" disabled>파일 저장</button>
    </div>
    <p id="copy-status" role="status" aria-live="polite" class="muted"></p>
    <details id="raw"><summary>내보낼 내용 / 직접 복사</summary><textarea id="output" readonly aria-label="측정 데이터"></textarea></details>
    <div id="pair"></div>
    <div id="nodes"></div>
    <p class="muted">크기·좌표는 확대율과 무관한 Figma px입니다. AUTO 행간은 px로 추정하지 않습니다. 속성을 바꾼 뒤에는 ‘다시 읽기’를 누르세요.</p>
  </main>
  <script>
    'use strict';
    const CHANNEL = 'alpas-readonly-inspector';
    const VERSION = '1.0.1';
    const $ = id => document.getElementById(id);
    let current = null;
    let responseTimer;
    const value = item => item === undefined || item === null ? '—' : typeof item === 'object' ? JSON.stringify(item) : String(item);
    const px = item => typeof item === 'number' ? `${Math.round(item * 1000) / 1000}px` : value(item);
    const colorText = items => Array.isArray(items) ? items.map(p => `${p.hex || p.type}${p.visible === false ? ' (숨김)' : ''}${p.opacity !== undefined ? ` / α ${p.opacity}` : ''}`).join(', ') || '없음' : value(items);
    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function rows(node) {
      if (node.error) return [['오류', node.error]];
      const g = node.geometry, a = node.appearance, layout = node.autoLayout;
      const result = [
        ['크기 W × H', `${px(g.width)} × ${px(g.height)}`],
        ['부모 기준 X / Y', `${px(g.x)} / ${px(g.y)}`],
        ['반경 TL/TR/BR/BL', [a.topLeftRadius, a.topRightRadius, a.bottomRightRadius, a.bottomLeftRadius].map(v => px(v === undefined ? a.cornerRadius : v)).join(' / ')],
        ['채우기', colorText(a.fills)], ['외곽선', `${colorText(a.strokes)} / ${px(a.strokeWeight)} / ${value(a.strokeAlign)}`],
        ['Auto Layout', layout ? layout.layoutMode : '해당 없음'],
      ];
      if (layout && layout.layoutMode !== 'NONE') result.push(
        ['padding T/R/B/L', [layout.paddingTop, layout.paddingRight, layout.paddingBottom, layout.paddingLeft].map(px).join(' / ')],
        ['itemSpacing', px(layout.itemSpacing)], ['정렬 주축/교차축', `${value(layout.primaryAxisAlignItems)} / ${value(layout.counterAxisAlignItems)}`],
      );
      if (node.sizing) result.push(['크기 모드 H / V', `${value(node.sizing.layoutSizingHorizontal)} / ${value(node.sizing.layoutSizingVertical)}`]);
      if (node.text) result.push(
        ['글꼴', value(node.text.fontName)], ['fontSize', px(node.text.fontSize)],
        ['fontWeight', value(node.text.fontWeight)], ['lineHeight', value(node.text.lineHeight)],
        ['letterSpacing', value(node.text.letterSpacing)],
        ['텍스트 정렬 H / V', `${value(node.text.textAlignHorizontal)} / ${value(node.text.textAlignVertical)}`],
      );
      return result;
    }
    function summary(data) {
      const lines = [`ALPAS Figma 수치 · ${data.page.name}`, `측정: ${data.exportedAt}`, '단위: Figma px / 읽기 전용'];
      data.nodes.forEach(node => {
        lines.push('', `${node.name} [${node.type} · ${node.id}]`, node.path || '');
        rows(node).forEach(([key, content]) => lines.push(`- ${key}: ${content}`));
        if (node.text) {
          lines.push(`- 텍스트: ${node.text.characters}`);
          if (node.text.fontSize === 'MIXED' || node.text.fontName === 'MIXED') lines.push(`- 구간별 스타일: ${JSON.stringify(node.text.runs)}`);
        }
      });
      if (data.pair) lines.push('', `두 레이어 간격(캔버스 축 기준): ${JSON.stringify(data.pair)}`);
      lines.push('', ...data.warnings.map(w => `주의: ${w}`), ...data.notes);
      return lines.join('\n');
    }
    function updateOutput() {
      $('output').value = current ? ($('format').value === 'json' ? JSON.stringify(current, null, 2) : summary(current)) : '';
    }
    function render(data) {
      current = data;
      $('status').textContent = data.selection.length ? `${data.page.name} · 선택 ${data.selection.length}개 · 읽은 레이어 ${data.nodes.length}개` : `${data.page.name} · 연결됨 · 선택 0개. 캔버스 또는 레이어 목록에서 프레임·컴포넌트·텍스트를 선택하세요.`;
      $('warnings').textContent = [...data.warnings, ...(data.hiddenSkipped ? [`숨김 하위 레이어 ${data.hiddenSkipped}개 제외`] : [])].join('\n');
      $('copy-status').textContent = '';
      $('copy').disabled = $('save').disabled = !data.nodes.length;
      $('nodes').replaceChildren();
      $('pair').replaceChildren();
      if (data.pair) $('pair').append(element('p', `두 레이어 간격: 가로 ${px(data.pair.horizontalGap)} / 세로 ${px(data.pair.verticalGap)} (캔버스 축 기준)`));
      data.nodes.forEach(node => {
        const card = element('details', undefined, 'node');
        card.open = node.depth === 0 || node.type === 'TEXT';
        card.append(element('summary', `${node.name} · ${node.type} · ${node.id}`));
        card.append(element('div', node.path || '', 'path muted'));
        const list = element('dl');
        rows(node).forEach(([key, content]) => list.append(element('dt', key), element('dd', content)));
        card.append(list);
        if (node.text) {
          card.append(element('div', node.text.characters, 'text'));
          if (node.text.fontSize === 'MIXED' || node.text.fontName === 'MIXED') {
            card.append(element('div', `혼합 스타일: ${JSON.stringify(node.text.runs)}`, 'text'));
          }
        }
        $('nodes').append(card);
      });
      updateOutput();
    }
    function request() {
      clearTimeout(responseTimer);
      clearResult('선택 정보를 읽는 중…');
      responseTimer = setTimeout(() => {
        clearResult('Figma 응답 없음 · ‘다시 읽기’를 누르세요. 계속되면 플러그인을 닫고 Development 메뉴에서 다시 실행하세요.');
      }, 5000);
      parent.postMessage({ pluginMessage: { channel: CHANNEL, type: 'inspect', children: $('children').checked, hidden: $('hidden').checked } }, '*');
    }
    function clearResult(status) {
      current = null; $('nodes').replaceChildren(); $('pair').replaceChildren(); $('output').value = '';
      $('warnings').textContent = ''; $('copy-status').textContent = '';
      $('copy').disabled = $('save').disabled = true;
      $('status').textContent = status;
    }
    $('refresh').addEventListener('click', request);
    $('children').addEventListener('change', request);
    $('hidden').addEventListener('change', request);
    $('format').addEventListener('change', updateOutput);
    $('copy').addEventListener('click', async () => {
      if (!current || !current.nodes.length) return;
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText($('output').value);
        $('copy-status').textContent = '복사했습니다. 대화창에 붙여넣어 주세요.';
      } catch (_) {
        $('raw').open = true;
        $('output').focus(); $('output').select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch (_) { /* Manual copy remains available. */ }
        $('copy-status').textContent = copied ? '복사했습니다. 대화창에 붙여넣어 주세요.' : '브라우저가 복사를 제한했습니다. 선택된 내용에서 Ctrl+C 또는 Cmd+C를 누르세요.';
      }
    });
    $('save').addEventListener('click', () => {
      if (!current || !current.nodes.length) return;
      const json = $('format').value === 'json';
      const url = URL.createObjectURL(new Blob([$('output').value], { type: json ? 'application/json' : 'text/plain;charset=utf-8' }));
      const link = element('a');
      link.href = url; link.download = `alpas-figma-${current.selection[0].id.replace(/[^a-zA-Z0-9_-]/g, '-')}.${json ? 'json' : 'txt'}`;
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      $('copy-status').textContent = '파일 다운로드를 요청했습니다. 다운로드 폴더를 확인해 주세요.';
    });
    window.addEventListener('message', event => {
      // Figma's documented bridge delivers event.data.pluginMessage; it does not
      // promise event.source === parent. Validate our envelope instead. These
      // messages only display data as text and never execute commands or HTML.
      const message = event.data && event.data.pluginMessage;
      if (!message || message.channel !== CHANNEL || !['snapshot', 'error'].includes(message.type)) return;
      clearTimeout(responseTimer);
      if (message.version !== VERSION) {
        clearResult('플러그인 파일 버전이 다릅니다. code.js와 ui.html을 함께 갱신하고 플러그인을 다시 실행하세요.');
        return;
      }
      try {
        if (message.type === 'error') {
          clearResult(`읽기 실패: ${String(message.message)} · 다른 프레임을 선택하거나 ‘다시 읽기’를 누르세요.`);
          return;
        }
        const data = message.data;
        if (!data || data.schema !== 'alpas-figma-inspector/v1' || data.readOnly !== true ||
          !data.page || typeof data.page.name !== 'string' ||
          !Array.isArray(data.selection) || !Array.isArray(data.nodes) ||
          !Array.isArray(data.warnings) || !Array.isArray(data.notes)) {
          throw new Error('수신한 측정 데이터 형식이 올바르지 않습니다.');
        }
        render(data);
      } catch (error) {
        clearResult(`표시 실패: ${String(error.message || error)} · ‘다시 읽기’를 누르세요. 계속되면 이 문구를 전달해 주세요.`);
      }
    });
    request();
  </script>
</body>
</html>
